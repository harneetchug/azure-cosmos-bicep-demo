name: Deploy Service Bus

on:
  push:
    paths:
      - 'modules/servicebus.bicep'
      - '.github/workflows/servicebus.yml'
      - 'params/dev.bicepparam'
    branches:
      - main

permissions:
  id-token: write
  contents: read


jobs:
  deploy-dev-servicebus:
    runs-on: ubuntu-latest
    environment: dev


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Service Bus Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group rg-cosmos-learning \
              --template-file modules/servicebus.bicep \
              --parameters serviceBusName=my-sb-demo