name: Deploy Logic App

on:
  push:
    paths:
      - 'modules/logicapp.bicep'
      - '.github/workflows/logicapp.yml'
      - 'params/dev.bicepparam'
    branches:
      - main

permissions:
  id-token: write
  contents: read


jobs:
  deploy-dev-logicapp:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Logic App
        run: |
          az deployment group create \
            --resource-group rg-cosmos-learning \
            --template-file modules/logicapp.bicep \
            --parameters \
              logicAppName=la-cosmos-dev \
              accountName=cosmos-acc-bicep \
              databaseName=customerdb \
              containerName=customercontainer \
              cosmosEndpoint=https://cosmos-acc-bicep.documents.azure.com:443/

      - name: Get Logic App Principal ID
        run: |
          PRINCIPAL_ID=$(az resource show \
            --resource-group rg-cosmos-learning \
            --name cosmos-logicapp \
            --resource-type Microsoft.Logic/workflows \
            --query identity.principalId \
            -o tsv)

          echo "PRINCIPAL_ID=$PRINCIPAL_ID" >> $GITHUB_ENV
          

      - name: Assign Cosmos DB RBAC Role
        run: |
          az cosmosdb sql role assignment create \
            --account-name cosmos-acc-bicep \
            --resource-group rg-cosmos-learning \
            --scope "/" \
            --principal-id $PRINCIPAL_ID \
            --role-definition-name "Cosmos DB Built-in Data Contributor"